validate:
  stage: validate
  tags:
    - backend
  cache:
    key: dotnet-nuget
    paths:
      - .nuget/packages/
  variables:
    CI_CONTAINER_NAME: "lms-ci-validate-$CI_JOB_ID"
  script:
    - mkdir -p "$CI_PROJECT_DIR/.nuget/packages"
    - >-
      docker run --rm --name "$CI_CONTAINER_NAME"
      -v "$CI_PROJECT_DIR:/workspace"
      -v "$CI_PROJECT_DIR/.nuget/packages:/root/.nuget/packages"
      -w /workspace
      -e NUGET_PACKAGES=/root/.nuget/packages
      mcr.microsoft.com/dotnet/sdk:10.0
      bash -c 'dotnet restore LMSBackend.slnx &&
      dotnet build LMSBackend.slnx --configuration Release --no-restore &&
      dotnet test LMSBackend.slnx --configuration Release --no-build --no-restore'
  after_script:
    - docker rm -f "$CI_CONTAINER_NAME" 2>/dev/null || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
