name: lms-production
services:
  database:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.database
    container_name: lms-production-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - production-postgres-data:/var/lib/postgresql/data
    networks:
      - production-database-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.backend
    image: ${PRODUCTION_IMAGE:-lmsbackend-production:local}
    container_name: lms-production-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      APP_BASE_URL: ${APP_BASE_URL}
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SubmissionStorage__MaxFileBytes: ${SubmissionStorage__MaxFileBytes}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - production-backend-network
      - production-database-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      database:
        condition: service_healthy

networks:
  production-backend-network:
    name: lms-production-backend-network

  production-database-network:
    name: lms-production-database-network
    internal: true

volumes:
  production-postgres-data:
    name: lms-production-postgres-data