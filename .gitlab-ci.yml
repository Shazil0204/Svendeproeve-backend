stages:
  - validate

  - staging-build
  - staging-database
  - staging-deploy
  - staging-verify
  - staging-configure

  - production-build
  - production-database
  - production-deploy
  - production-verify
  - production-configure

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

include:
  - local: "Pipeline/validate.yml"
  - local: "Pipeline/staging.yml"
  - local: "Pipeline/production.yml"